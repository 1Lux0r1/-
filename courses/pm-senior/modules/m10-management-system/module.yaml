key: m10
title: "Система управления: планирование, контроль качества, операционная модель"
summary: >
  Как построить систему, в которой проекты планируются и контролируются стабильно независимо от конкретного PM: контуры управления, многоуровневое планирование, регламенты, показатели, качество процессов, данные и внедрение.
